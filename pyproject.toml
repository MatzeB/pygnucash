[project]
name = "pygnucash"
version = "0.1.0"
description = "Python library to read GnuCash SQL files"
authors = [{ name = "Matthias Braun", email = "matze@braunis.de" }]
requires-python = ">=3.12"
readme = "README.md"
license = "BSD-1-Clause"
dependencies = [
    "ruff>=0.9.10",
]

[dependency-groups]
dev = [
    "ruff>=0.9.5",
    "mypy>=1.15.0",
    "types-requests>=2.32.0.20241016",
]
examples = ["requests>=2.32.3"]

[tool.uv]
package = false
default-groups = [
    "dev",
    "examples",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
preview = true
select = [
    "ANN",
    "ARG",
    "ARG",
    "B",
    "C4",
    "DTZ",
    "E",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "I",
    "N",
    "PIE",
    "PLW1514",
    "PYI",
    "RET",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "UP",
    "W",
    "YTT",
]
ignore = [
    "ANN401",  # any-type
    "ARG002",  # unused-method-argument
    "FURB101", # read-whole-file
    "FURB103", # write-whole-file
    "FURB113", # repeated-append
    "RET504",  # unnecessary-assign
    "S101",    # assert
    "S110",    # try-except-pass
    "S404",    # suspicious-subprocess-import
    "S603",    # subprocess-without-shell-equals-true
    "SIM105",  # suppressible-exception
    "SIM108",  # if-else-block-instead-of-if-exp
    "SIM113",  # enumerate-for-loop
    "UP047",   # non-pep695-generic-function
    "UP040",   # non-pep695-type-alias
]

[tool.mypy]
strict = true
